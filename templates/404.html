<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CropSense — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a3d1f, #0d2b1a);
      color: #ecf0f1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .code { font-size: 6rem; font-weight: 800; opacity: 0.15; line-height: 1; }
    .emoji { font-size: 3rem; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    p  { font-size: 0.9rem; color: rgba(236,240,241,0.55); }
    a  {
      margin-top: 10px; color: #52be80; text-decoration: none;
      border: 1px solid rgba(82,190,128,0.3); padding: 10px 24px; border-radius: 50px;
      font-size: 0.88rem; font-weight: 600; transition: all 0.2s;
    }
    a:hover { background: rgba(82,190,128,0.1); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <div class="emoji">🌿</div>
  <h1>Page Not Found</h1>
  <p>This crop field doesn't exist. Let's head back.</p>
  <a href="/">← Back to Home</a>
</body>
</html>
